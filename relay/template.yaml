AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Proofloop short relay. Participants' recordings wait here until the
  researcher's plugin imports them into the laptop study folder. Objects
  are encrypted, private, and deleted by lifecycle rule after RetentionDays
  (default 1, at most 7). Link and admin secrets live in Secrets Manager,
  not in Lambda environment variables.

Parameters:
  # AllowedPattern: printable ASCII without space, double quote or backslash,
  # so the values cannot break out of the JSON SecretString below.
  RelaySecret: { Type: String, NoEcho: true, MinLength: 32, AllowedPattern: '^[!#-\[\]-~]+$', ConstraintDescription: 'printable ASCII, no spaces, quotes or backslashes', Description: HMAC key for participant links (same value as the plugin's secrets file) }
  AdminToken: { Type: String, NoEcho: true, MinLength: 32, AllowedPattern: '^[!#-\[\]-~]+$', ConstraintDescription: 'printable ASCII, no spaces, quotes or backslashes', Description: Bearer token the plugin uses to import and delete }
  RetentionDays: { Type: Number, Default: 1, MinValue: 1, MaxValue: 7, Description: "Days uploads may wait in the relay before deletion (FR-PLG-009: 1 by default, at most 7)" }
  AllowedOrigins: { Type: String, Description: "Comma-separated origins that host the participant page, e.g. https://research.example.com" }

Resources:
  RelayBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - { Id: delete-after-retention, Status: Enabled, ExpirationInDays: !Ref RetentionDays, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: !Split [',', !Ref AllowedOrigins]
            AllowedHeaders: [content-type]
            MaxAge: 600

  RelayBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RelayBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt RelayBucket.Arn, !Sub '${RelayBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  RelaySecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Proofloop relay link-signing secret and admin token
      KmsKeyId: alias/aws/secretsmanager
      SecretString: !Sub '{"relay_secret":"${RelaySecret}","admin_token":"${AdminToken}"}'

  RelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: handler.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 10
      # Caps how many requests run at once, so a flood can't run up the bill.
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          BUCKET: !Ref RelayBucket
          SECRET_ARN: !Ref RelaySecrets
          RETENTION_DAYS: !Ref RetentionDays
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub '${RelayBucket.Arn}/*'
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !GetAtt RelayBucket.Arn
            # Read this one secret only. The AWS managed key's policy lets
            # Secrets Manager decrypt on the role's behalf.
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref RelaySecrets
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig: { LogFormat: JSON, ApplicationLogLevel: WARN }

Outputs:
  RelayUrl: { Value: !GetAtt RelayFunctionUrl.FunctionUrl, Description: Put this in research-setup as the relay URL }
  Bucket: { Value: !Ref RelayBucket }
