name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Unit and end-to-end tests
        run: npm test
      - name: Bundle matches source
        run: |
          npm run build
          git diff --exit-code -- dist/server.mjs src/lib/web-assets.generated.mjs
      - name: Tests against the bundle
        run: PROOFLOOP_SERVER=dist/server.mjs node --test test/*.test.mjs
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
